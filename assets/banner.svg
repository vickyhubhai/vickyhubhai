<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Vicky Pandey - vickyhubhai - Build Fast. Build Secure. Build Bold.">
  <!--
    Self-hosted profile banner. No external fonts, scripts or network requests:
    this file ships with the repository, so the README header cannot break when a
    third-party badge service is down.
    Dark colours are baked in as attributes; the <style> block only overrides them
    for light mode (and is ignored harmlessly if a renderer strips it).
  -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .bg   { fill: #0d1117; }
    .name { fill: #f0f6fc; }
    .sub  { fill: #9aa4b2; }
    .dots { opacity: 0.6; }
    @media (prefers-color-scheme: light) {
      .bg   { fill: #f6f8fa; }
      .name { fill: #0b1220; }
      .sub  { fill: #57606a; }
      .dots { opacity: 0.4; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="210" rx="20"/>
  <rect x="0" y="0" width="8" height="210" rx="4" fill="url(#accent)"/>

  <circle cx="1058" cy="72" r="96" fill="url(#glow)"/>
  <g class="dots">
    <circle cx="1024" cy="64" r="5" fill="#22d3ee"/>
    <circle cx="1056" cy="64" r="5" fill="#7c3aed"/>
    <circle cx="1088" cy="64" r="5" fill="#ec4899"/>
  </g>

  <text class="name" x="56" y="94" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="0.5">Vicky Pandey</text>
  <text class="sub" x="56" y="134" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19">vickyhubhai &#183; TerrorBhai &#183; Full-Stack Engineer</text>
  <text x="56" y="174" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#22d3ee">Build Fast. Build Secure. Build Bold.</text>
</svg>
